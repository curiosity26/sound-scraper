# Sets up a Linux runner (Ubuntu 24.04) to build the GTK4 app: the system
# packages react-native-gtk4 and the Rust core need, Node with the app's
# dependencies (including @curiosity26/react-native-gtk4, an optional
# dependency installed from its public GitHub repository), and Rust.
name: Set up the Linux build
description: System packages, Node + react-native-gtk4, Rust

inputs:
  cache-key:
    description: Rust cache key
    required: true
  host:
    description: >-
      The React Native host library the job builds: debug (run-linux) or
      release (package-linux). It names the job's react-native-gtk4 build cache.
    required: true

outputs:
  rngtk-cache-key:
    description: The react-native-gtk4 build cache's key
    value: ${{ steps.rngtk.outputs.key }}
  rngtk-cache-hit:
    description: true when that cache was restored, so there's nothing new to save
    value: ${{ steps.rngtk-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config git python3 \
          libgtk-4-dev libsoup-3.0-dev libssl-dev libicu-dev libreadline-dev \
          libpulse-dev libasound2-dev \
          python3-gi gir1.2-gdkpixbuf-2.0 desktop-file-utils appstream dpkg-dev xvfb
    - uses: actions/setup-node@v4
      with:
        node-version-file: app/.nvmrc
        cache: npm
        cache-dependency-path: app/package-lock.json
    - name: Install JS dependencies
      shell: bash
      working-directory: app
      run: npm ci
    - run: rustup toolchain install
      shell: bash
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: core
        key: ${{ inputs.cache-key }}
    # react-native-gtk4's build cache: React Native's sources, Hermes and the
    # host library, the long part of a build. They change only with
    # react-native-gtk4 (scripts/rngtk-cache-key.sh) or the compiler, so
    # that's the key. Restored here; the job
    # saves it after its build (scripts/trim-rngtk-cache.sh, then
    # actions/cache/save with rngtk-cache-key), so a later failing test
    # doesn't lose it.
    - id: rngtk
      shell: bash
      run: |
        cc=$(clang --version | head -1 | sha256sum | cut -c1-8)
        echo "key=$(scripts/rngtk-cache-key.sh "$ImageOS-$RUNNER_ARCH-clang$cc-${{ inputs.host }}")" >> "$GITHUB_OUTPUT"
    - id: rngtk-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/react-native-gtk4
        key: ${{ steps.rngtk.outputs.key }}
