# Builds the website in site/ (Astro) and publishes it on GitHub Pages.
#
# - A push to main that touches the site or what it's made from (the skins,
#   the skin guide, screenshots, artwork) deploys it.
# - Each finished release redeploys it, so the downloads page offers the
#   new installers and skins.
# - A pull request that touches the site builds and checks it, without
#   deploying.
# - Run workflow (workflow_dispatch) deploys from main.
#
# The downloads page reads the latest release from the GitHub API at build
# time, and the skin cards' pictures are rendered from skins/ with the
# app's own skin renderer (core/crates/skin, example preview_skin).
#
# One-time setup: Settings › Pages › Build and deployment › Source:
# GitHub Actions, and Custom domain: soundscraper.app (with Enforce HTTPS).
# With a workflow deploy GitHub ignores a CNAME file; the domain is the
# Pages setting, and configure-pages hands it to the build.
name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - skins/**
      - docs/skins.md
      - docs/images/**
      - assets/**
      - core/crates/skin/**
      - .github/workflows/website.yml
  pull_request:
    paths:
      - site/**
      - skins/**
      - docs/skins.md
      - docs/images/**
      - assets/**
      - core/crates/skin/**
      - .github/workflows/website.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue one at a time in "deploy". A pull request gets its own
# group, and so does a Release run that isn't a published release (a pull
# request's dry run or a warm-up on main): it builds nothing, and in
# "deploy" it would wait behind a deploy and push a queued one out of line.
concurrency:
  group: >-
    website-${{
      (github.event_name == 'pull_request' && github.ref) ||
      (github.event_name == 'workflow_run' &&
       !(github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         startsWith(github.event.workflow_run.head_branch, 'v')) &&
       github.run_id) ||
      'deploy'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # After a Release run, only when it published a release (a version tag;
    # warm-up runs on main and dry runs don't).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # A Release run's tag isn't the site's source; main is.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: website
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - name: Render the skin previews
        run: npm run previews
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_RELEASE: '1'
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
