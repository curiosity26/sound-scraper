# CodeQL code scanning (advanced setup; replaces the repository's default
# setup, which has to be turned off in Settings > Code security for these
# uploads to be accepted). Every language is scanned from source without a
# build except Swift: CodeQL only sees Swift that gets compiled, so the macOS
# job installs the pods and builds the app (Debug, arm64, unsigned), which
# default setup's autobuild couldn't do (it ran `pod install` with no
# node_modules or Bundler).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
          - language: rust
            build-mode: none
          - language: swift
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'swift'
        uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: matrix.language == 'swift'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: app
          bundler-cache: true
      # The app's build phases build the Rust core and the now-playing adapter.
      - if: matrix.language == 'swift'
        run: rustup toolchain install
      - if: matrix.language == 'swift'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: codeql-macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Outside CodeQL's tracing: only the app's own Swift needs extracting.
      - if: matrix.language == 'swift'
        name: Install JS dependencies and pods
        run: |
          npm ci --prefix app
          cd app/macos && BUNDLE_GEMFILE=../Gemfile bundle exec pod install

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.language == 'swift'
        name: Build the macOS app
        working-directory: app/macos
        run: |
          set -o pipefail
          xcodebuild -workspace SoundScraper.xcworkspace -scheme SoundScraper-macOS \
            -configuration Debug -derivedDataPath build/CodeQL ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
