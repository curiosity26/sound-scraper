# Builds the signed, notarized Mac .dmg, the signed Windows ARM64 and x64
# .msix and the Linux x86_64 and aarch64 packages (.deb for Ubuntu/Mint and
# Debian, .rpm for Fedora and EL 10, a .flatpak and a .tar.gz) for a version
# tag, then publishes them as a GitHub Release.
#   git tag v1.2.0 && git push origin v1.2.0           # release
#   git tag v1.2.0-beta.1 && git push origin v1.2.0-beta.1   # pre-release
# The tag must match the version in every project file (scripts/version.py
# set 1.2.0 and commit before tagging). One-time setup: docs/release.md.
#
# Dry run: the label `release-dry-run` on a pull request (and each push to
# it after), or Run workflow (workflow_dispatch), builds everything for
# package.json's version without the release environment's secrets: the
# Mac app ad-hoc signed and not notarized, the .msix unsigned. The packages
# are the run's artifacts; nothing is published.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a dry-run pull request replaces its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    # Pull requests: only labeled release-dry-run (every other job needs
    # this one, so they skip too).
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'release-dry-run') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-dry-run'))
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          # A dry run checks package.json's version instead of a tag.
          [ -n "$TAG" ] || TAG=v$(jq -r .version app/package.json)
          scripts/version.py check "$TAG"
          [[ "$TAG" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-26
    # The release environment's secrets reach only v* tags; a dry run uses
    # an environment without any (GitHub creates it on first use).
    environment: ${{ github.event_name == 'push' && 'release' || 'release-dry-run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: app
          bundler-cache: true
      # Installs the toolchain pinned in rust-toolchain.toml, with its targets.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: macos-arm64
      - name: Install JS dependencies and pods
        run: |
          npm ci --prefix app
          cd app/macos && BUNDLE_GEMFILE=../Gemfile bundle exec pod install

      - name: Import the Developer ID certificate
        if: github.event_name == 'push'
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign and notarize the .dmg
        env:
          # Dry run: ad-hoc signed ("-"), not notarized.
          SIGN_IDENTITY: "${{ github.event_name == 'push' && 'Developer ID Application: Alex Boyce (B53W8TX3Q9)' || '-' }}"
          NOTARIZE: ${{ github.event_name == 'push' && '1' || '0' }}
          APP_BUILD: ${{ github.run_number }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$NOTARY_KEY_P8" ]; then
            export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY"
          fi
          scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  windows:
    needs: version
    runs-on: windows-2025
    environment: ${{ github.event_name == 'push' && 'release' || 'release-dry-run' }}
    permissions:
      contents: read
      id-token: write   # Azure sign-in through OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ARM64
            rust-target: aarch64-pc-windows-msvc
          - platform: x64
            rust-target: x86_64-pc-windows-msvc
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Installs the toolchain pinned in rust-toolchain.toml, with its targets.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: windows-${{ matrix.platform }}
      - run: npm ci --prefix app
      # react-native-windows defaults to SDK 10.0.22621.0, which the runner
      # doesn't have; build against the newest one it does.
      - name: Pick the Windows SDK
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Where-Object { Test-Path "$($_.FullName)\um\windows.h" } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          "Windows SDK $($sdk.Name)"
          "WINDOWS_SDK=$($sdk.Name)" >> $env:GITHUB_ENV

      - name: Install the Artifact Signing plugin
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          nuget install Microsoft.ArtifactSigning.Client -x -NonInteractive -OutputDirectory "$env:RUNNER_TEMP\asc"
          $dlib = Get-ChildItem -Recurse -Filter Azure.CodeSigning.Dlib.dll "$env:RUNNER_TEMP\asc" |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dlib) { throw "x64 Azure.CodeSigning.Dlib.dll not found in the NuGet package" }
          "SS_SIGNING_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          # Not a secret: account and profile names. Authentication is the az login below.
          @{
            Endpoint = "https://eus.codesigning.azure.net"
            CodeSigningAccountName = "soundscraperalex"
            CertificateProfileName = "SoundScraperPublic"
            ExcludeCredentials = @("ManagedIdentityCredential", "WorkloadIdentityCredential", "SharedTokenCacheCredential",
              "VisualStudioCredential", "VisualStudioCodeCredential", "AzurePowerShellCredential",
              "AzureDeveloperCliCredential", "InteractiveBrowserCredential", "EnvironmentCredential")
          } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\metadata.json"

      # Build first, then sign in to Azure and run the script again (an
      # incremental build) to sign: the Azure sign-in is short-lived and a cold
      # build can outlast it.
      - name: Build the .msix
        shell: powershell
        run: .\scripts\package-windows.ps1 -Platform ${{ matrix.platform }} -WindowsSdk $env:WINDOWS_SDK
      # Dry run: the .msix stays unsigned.
      - uses: azure/login@v2
        if: github.event_name == 'push'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true   # signing needs only the role on the signing account
      - name: Sign the .msix
        if: github.event_name == 'push'
        shell: powershell
        run: .\scripts\package-windows.ps1 -Platform ${{ matrix.platform }} -WindowsSdk $env:WINDOWS_SDK -ArtifactSigning -Metadata "$env:RUNNER_TEMP\metadata.json"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.platform }}
          path: dist/*.msix
          if-no-files-found: error

  # Linux (GTK4, react-native-gtk4): a .deb or .rpm per distribution, each
  # built, installed and started in a container of it
  # (scripts/package-linux-in-container.sh), since packages link their
  # distribution's libraries. Ubuntu 24.04's .deb also covers Linux Mint 22
  # and newer, and its build adds the app as a tree to unpack anywhere
  # (.tar.gz; install.sh puts it in ~/.local). react-native-gtk4 needs GTK
  # 4.14 or newer, so Debian 13 and EL 10 are the oldest; Fedora's package
  # is for one release (its library versions change with each). The
  # Flatpak is built in the GNOME SDK (flatpak).
  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        distro:
          - {tag: ubuntu24.04, image: "docker.io/library/ubuntu:24.04", format: deb, tarball: "1"}
          - {tag: debian13, image: "docker.io/library/debian:13", format: deb}
          - {tag: fc44, image: "registry.fedoraproject.org/fedora:44", format: rpm}
          - {tag: el10, image: "docker.io/library/almalinux:10", format: rpm}
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Rust, npm and react-native-gtk4's Hermes and host builds.
      - uses: actions/cache@v4
        with:
          path: .cache/linux-${{ matrix.distro.tag }}
          key: linux-${{ matrix.distro.tag }}-${{ matrix.arch }}-${{ hashFiles('app/package-lock.json', 'core/Cargo.lock') }}
          restore-keys: linux-${{ matrix.distro.tag }}-${{ matrix.arch }}-
      - name: Build, install and start the package
        env:
          CONTAINER_ENGINE: docker
          TARBALL: ${{ matrix.distro.tarball }}
        run: |
          scripts/package-linux-in-container.sh "${{ matrix.distro.image }}" ${{ matrix.distro.format }} ${{ matrix.distro.tag }}
          ls -la dist
      # The container wrote the cache as root.
      - run: sudo chown -R "$(id -u):$(id -g)" .cache
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.distro.tag }}-${{ matrix.arch }}
          path: |
            dist/*.${{ matrix.distro.format }}
            dist/*.tar.gz
          if-no-files-found: error

  # A Flatpak bundle (any distribution with Flatpak), built from source in
  # the GNOME SDK as Flathub requires (scripts/package-flatpak.sh), then
  # installed and started.
  flatpak:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # flatpak-builder-tools, pinned: the npm and cargo sources generators.
      BUILDER_TOOLS: 74697c75b630d7330e77250fc13cb5ea688d9479
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder and the source generators
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus-x11
          git clone -q https://github.com/flatpak/flatpak-builder-tools.git "$RUNNER_TEMP/tools"
          git -C "$RUNNER_TEMP/tools" checkout -q "$BUILDER_TOOLS"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "$RUNNER_TEMP/tools/node" aiohttp PyYAML tomlkit
          echo "FLATPAK_NODE_GENERATOR=$RUNNER_TEMP/venv/bin/flatpak-node-generator" >> "$GITHUB_ENV"
          echo "FLATPAK_CARGO_GENERATOR=$RUNNER_TEMP/venv/bin/python3 $RUNNER_TEMP/tools/cargo/flatpak-cargo-generator.py" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install JS dependencies
        working-directory: app
        run: npm ci
      # flatpak-builder's state: the SDK build of React Native, Hermes and
      # the host (the long part), and downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/react-native-gtk4/flatpak
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('app/package-lock.json', 'core/Cargo.lock') }}
          restore-keys: flatpak-${{ matrix.arch }}-
      - name: Build, install and start the Flatpak
        run: xvfb-run -a dbus-run-session -- scripts/package-flatpak.sh --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    needs: [version, macos, windows, linux, flatpak]
    # Not for dry runs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      # Every skin in skins/ except the built-in Default, as a .sskin named
      # after the skin ("Hi-Fi '74" -> HiFi74.sskin).
      - name: Package the extra skins
        run: |
          for dir in skins/*/; do
            [ "$(basename "$dir")" = default ] && continue
            name=$(jq -r .name "$dir/skin.json" | tr -cd '[:alnum:]')
            cargo run -q --manifest-path core/Cargo.toml -p sound_scraper_skin \
              --example package_skin -- "$dir" "dist/$name.sskin"
          done
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Sound Scraper ${TAG#v}" --generate-notes "${flags[@]}"
