# Builds the signed, notarized Mac .dmg, the signed Windows ARM64 and x64
# .msix and the Linux x86_64 and aarch64 packages (.deb for Ubuntu/Mint and
# Debian, .rpm for Fedora and EL 10, a .flatpak and a .tar.gz) for a version
# tag, then publishes them as a GitHub Release.
#   git tag v1.2.0 && git push origin v1.2.0           # release
#   git tag v1.2.0-beta.1 && git push origin v1.2.0-beta.1   # pre-release
# The tag must match the version in every project file (scripts/version.py
# set 1.2.0 and commit before tagging). One-time setup: docs/release.md.
#
# Dry run: the label `release-dry-run` on a pull request (and each push to
# it after), or Run workflow (workflow_dispatch), builds everything for
# package.json's version without the release environment's secrets: the
# Mac app ad-hoc signed and not notarized, the .msix unsigned. The packages
# are the run's artifacts; nothing is published.
#
# Cache warm-up: a tag's run can restore only caches saved on main, so main
# keeps each build job's caches for it: react-native-gtk4's build (React
# Native, Hermes, the host library) for Linux and Flatpak, Xcode's compilation
# cache (React Native's pods) for macOS, the NuGet packages for Windows, and the Rust
# core's build for both of those. A push to main that touches what they're
# built from, and a run every few days (a cache unused for 7 days is
# evicted), run the build jobs: each checks for its cache and builds
# (unsigned), then saves it, only when it's missing. Run workflow on main (a
# full dry run) saves missing caches too.
name: Release

on:
  push:
    tags: ["v*"]
    # Warm-up (path filters don't apply to tags).
    branches: [main]
    paths:
      - app/package-lock.json
      - app/macos/Podfile.lock
      - app/windows/**/*.vcxproj
      - app/windows/**/*.props
      - scripts/flatpak_manifest.py
      - scripts/linux-build-deps.sh
      - scripts/package-flatpak.sh
      - scripts/package-linux-in-container.sh
      - scripts/rngtk-cache-key.sh
      - scripts/trim-rngtk-cache.sh
      - .github/workflows/release.yml
  schedule:
    - cron: '0 5 */5 * *'
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a dry-run pull request replaces its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    # Pull requests: only labeled release-dry-run (every other job needs
    # this one, so they skip too).
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'release-dry-run') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'release-dry-run'))
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.v.outputs.prerelease }}
      # true: a cache warm-up run (a push to main or the schedule).
      warm-up: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_type == 'branch') }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # A dry run checks package.json's version instead of a tag.
          [ -n "$TAG" ] || TAG=v$(jq -r .version app/package.json)
          scripts/version.py check "$TAG"
          [[ "$TAG" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-26
    # The release environment's secrets reach only v* tags; a dry run or a
    # warm-up uses an environment without any (GitHub creates it on first use).
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'release-dry-run' }}
    steps:
      - uses: actions/checkout@v4
      # Xcode's compilation cache for the C, C++ and Objective-C compile:
      # React Native's pods, most of the build. They change with Podfile.lock
      # or Xcode, so that's the key; an older cache (restore-keys) still
      # covers most of a changed build. Saved on main (below), the only place
      # a tag's run can restore it from.
      - id: cas
        run: echo "key=macos-xcode-cas-xcode$(xcodebuild -version | shasum | cut -c1-8)-${{ hashFiles('app/macos/Podfile.lock') }}" >> "$GITHUB_OUTPUT"
      # A warm-up only needs to know whether it's there.
      - uses: actions/cache/restore@v4
        id: lookup
        if: needs.version.outputs.warm-up == 'true'
        with:
          path: app/macos/build/CompilationCache
          key: ${{ steps.cas.outputs.key }}
          lookup-only: true
      # false: a warm-up whose cache is there, with nothing to do.
      - id: build
        run: echo "build=${{ steps.lookup.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        if: steps.build.outputs.build == 'true'
        with:
          path: app/macos/build/CompilationCache
          key: ${{ steps.cas.outputs.key }}
          restore-keys: macos-xcode-cas-xcode
      - uses: actions/setup-node@v4
        if: steps.build.outputs.build == 'true'
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: ruby/setup-ruby@v1
        if: steps.build.outputs.build == 'true'
        with:
          ruby-version: "3.3"
          working-directory: app
          bundler-cache: true
      # Installs the toolchain pinned in rust-toolchain.toml, with its targets.
      - run: rustup toolchain install
        if: steps.build.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.build.outputs.build == 'true'
        with:
          workspaces: core
          key: macos-arm64
          # Tags and pull requests restore from main.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: Install JS dependencies and pods
        if: steps.build.outputs.build == 'true'
        run: |
          npm ci --prefix app
          cd app/macos && BUNDLE_GEMFILE=../Gemfile bundle exec pod install

      - name: Import the Developer ID certificate
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign and notarize the .dmg
        if: steps.build.outputs.build == 'true'
        env:
          # Dry run and warm-up: ad-hoc signed ("-"), not notarized.
          SIGN_IDENTITY: "${{ github.event_name == 'push' && github.ref_type == 'tag' && 'Developer ID Application: Alex Boyce (B53W8TX3Q9)' || '-' }}"
          NOTARIZE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && '1' || '0' }}
          APP_BUILD: ${{ github.run_number }}
          COMPILATION_CACHE_CAS_PATH: ${{ github.workspace }}/app/macos/build/CompilationCache
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$NOTARY_KEY_P8" ]; then
            export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY"
          fi
          scripts/package-macos.sh
          du -sh "$COMPILATION_CACHE_CAS_PATH"

      # Saved on main only: tags and pull requests restore from main.
      - uses: actions/cache/save@v4
        if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && steps.build.outputs.build == 'true' && steps.restore.outputs.cache-hit != 'true'
        with:
          path: app/macos/build/CompilationCache
          key: ${{ steps.cas.outputs.key }}

      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.warm-up != 'true'
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
  windows:
    needs: version
    runs-on: windows-2025
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'release-dry-run' }}
    permissions:
      contents: read
      id-token: write   # Azure sign-in through OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ARM64
            rust-target: aarch64-pc-windows-msvc
          - platform: x64
            rust-target: x86_64-pc-windows-msvc
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      # The NuGet packages the build restores (react-native-windows' prebuilt
      # Microsoft.ReactNative, Hermes and the rest), a 3-minute download. They
      # change with react-native-windows and the projects, so that's the key.
      # Saved on main (below), the only place a tag's run can restore it from.
      - id: nuget
        shell: bash
        run: |
          rnw=$(jq -er '.packages["node_modules/react-native-windows"].version' app/package-lock.json)
          echo "key=windows-nuget-${{ matrix.platform }}-rnw$rnw-${{ hashFiles('app/windows/**/*.vcxproj', 'app/windows/**/*.props') }}" >> "$GITHUB_OUTPUT"
      # A warm-up only needs to know whether it's there.
      - uses: actions/cache/restore@v4
        id: lookup
        if: needs.version.outputs.warm-up == 'true'
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.key }}
          lookup-only: true
      # false: a warm-up whose cache is there, with nothing to do.
      - id: build
        shell: bash
        run: echo "build=${{ steps.lookup.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        if: steps.build.outputs.build == 'true'
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.key }}
          restore-keys: windows-nuget-${{ matrix.platform }}-
      - uses: actions/setup-node@v4
        if: steps.build.outputs.build == 'true'
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Installs the toolchain pinned in rust-toolchain.toml, with its targets.
      - run: rustup toolchain install
        if: steps.build.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.build.outputs.build == 'true'
        with:
          workspaces: core
          key: windows-${{ matrix.platform }}
          # Tags and pull requests restore from main.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - run: npm ci --prefix app
        if: steps.build.outputs.build == 'true'
      # react-native-windows defaults to SDK 10.0.22621.0, which the runner
      # doesn't have; build against the newest one it does.
      - name: Pick the Windows SDK
        if: steps.build.outputs.build == 'true'
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Where-Object { Test-Path "$($_.FullName)\um\windows.h" } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          "Windows SDK $($sdk.Name)"
          "WINDOWS_SDK=$($sdk.Name)" >> $env:GITHUB_ENV

      - name: Install the Artifact Signing plugin
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          nuget install Microsoft.ArtifactSigning.Client -x -NonInteractive -OutputDirectory "$env:RUNNER_TEMP\asc"
          $dlib = Get-ChildItem -Recurse -Filter Azure.CodeSigning.Dlib.dll "$env:RUNNER_TEMP\asc" |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dlib) { throw "x64 Azure.CodeSigning.Dlib.dll not found in the NuGet package" }
          "SS_SIGNING_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          # Not a secret: account and profile names. Authentication is the az login below.
          @{
            Endpoint = "https://eus.codesigning.azure.net"
            CodeSigningAccountName = "soundscraperalex"
            CertificateProfileName = "SoundScraperPublic"
            ExcludeCredentials = @("ManagedIdentityCredential", "WorkloadIdentityCredential", "SharedTokenCacheCredential",
              "VisualStudioCredential", "VisualStudioCodeCredential", "AzurePowerShellCredential",
              "AzureDeveloperCliCredential", "InteractiveBrowserCredential", "EnvironmentCredential")
          } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\metadata.json"

      # Build first, then sign in to Azure and sign: the Azure sign-in is
      # short-lived and a cold build can outlast it.
      - name: Build the .msix
        if: steps.build.outputs.build == 'true'
        shell: powershell
        run: .\scripts\package-windows.ps1 -Platform ${{ matrix.platform }} -WindowsSdk $env:WINDOWS_SDK
      # Dry run: the .msix stays unsigned.
      - uses: azure/login@v2
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true   # signing needs only the role on the signing account
      - name: Sign the .msix
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: powershell
        run: .\scripts\package-windows.ps1 -Platform ${{ matrix.platform }} -WindowsSdk $env:WINDOWS_SDK -ArtifactSigning -SignOnly -Metadata "$env:RUNNER_TEMP\metadata.json"

      # Saved on main only: tags and pull requests restore from main.
      - uses: actions/cache/save@v4
        if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && steps.build.outputs.build == 'true' && steps.restore.outputs.cache-hit != 'true'
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.key }}

      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.warm-up != 'true'
        with:
          name: windows-${{ matrix.platform }}
          path: dist/*.msix
          if-no-files-found: error

  # Linux (GTK4, react-native-gtk4): a .deb or .rpm per distribution, each
  # built, installed and started in a container of it
  # (scripts/package-linux-in-container.sh), since packages link their
  # distribution's libraries. Ubuntu 24.04's .deb also covers Linux Mint 22
  # and newer, and its build adds the app as a tree to unpack anywhere
  # (.tar.gz; install.sh puts it in ~/.local). react-native-gtk4 needs GTK
  # 4.14 or newer, so Debian 13 and EL 10 are the oldest; Fedora's package
  # is for one release (its library versions change with each). The
  # Flatpak is built in the GNOME SDK (flatpak).
  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        distro:
          - {tag: ubuntu24.04, image: "docker.io/library/ubuntu:24.04", format: deb, tarball: "1"}
          - {tag: debian13, image: "docker.io/library/debian:13", format: deb}
          - {tag: fc44, image: "registry.fedoraproject.org/fedora:44", format: rpm}
          - {tag: el10, image: "docker.io/library/almalinux:10", format: rpm}
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # react-native-gtk4's build of React Native, Hermes and the host
      # library, the long part. Saved on main (below), the only place a
      # tag's run can restore it from.
      - id: rngtk
        run: echo "key=$(scripts/rngtk-cache-key.sh linux-${{ matrix.distro.tag }}-${{ matrix.arch }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: .cache/linux-${{ matrix.distro.tag }}/rngtk
          key: ${{ steps.rngtk.outputs.key }}
          # A warm-up only needs to know whether it's there.
          lookup-only: ${{ needs.version.outputs.warm-up == 'true' }}
      - name: Build, install and start the package
        if: needs.version.outputs.warm-up != 'true' || steps.restore.outputs.cache-hit != 'true'
        env:
          CONTAINER_ENGINE: docker
          TARBALL: ${{ matrix.distro.tarball }}
        run: |
          scripts/package-linux-in-container.sh "${{ matrix.distro.image }}" ${{ matrix.distro.format }} ${{ matrix.distro.tag }}
          ls -la dist
      # The container wrote the cache as root.
      - run: '[ ! -d .cache ] || sudo chown -R "$(id -u):$(id -g)" .cache'
        if: always()
      # Saved on main only: tags and pull requests restore from main.
      - name: Trim the react-native-gtk4 build cache
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        run: scripts/trim-rngtk-cache.sh .cache/linux-${{ matrix.distro.tag }}/rngtk
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        with:
          path: .cache/linux-${{ matrix.distro.tag }}/rngtk
          key: ${{ steps.rngtk.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.warm-up != 'true'
        with:
          name: linux-${{ matrix.distro.tag }}-${{ matrix.arch }}
          path: |
            dist/*.${{ matrix.distro.format }}
            dist/*.tar.gz
          if-no-files-found: error

  # A Flatpak bundle (any distribution with Flatpak), built from source in
  # the GNOME SDK as Flathub requires (scripts/package-flatpak.sh), then
  # installed and started.
  flatpak:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # flatpak-builder-tools, pinned: the npm and cargo sources generators.
      BUILDER_TOOLS: 74697c75b630d7330e77250fc13cb5ea688d9479
    steps:
      - uses: actions/checkout@v4
      # flatpak-builder's state: the SDK build of React Native, Hermes and
      # the host (the long part), and downloads. Saved on main (below), the
      # only place a tag's run can restore it from.
      - id: rngtk
        run: echo "key=$(scripts/rngtk-cache-key.sh flatpak-${{ matrix.arch }}-${{ hashFiles('scripts/flatpak_manifest.py') }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: ~/.cache/react-native-gtk4/flatpak/state
          key: ${{ steps.rngtk.outputs.key }}
          # A warm-up only needs to know whether it's there.
          lookup-only: ${{ needs.version.outputs.warm-up == 'true' }}
      # false: a warm-up whose cache is there, with nothing to do.
      - id: build
        run: echo "build=${{ needs.version.outputs.warm-up != 'true' || steps.restore.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"
      - name: Install flatpak-builder and the source generators
        if: steps.build.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus-x11
          git clone -q https://github.com/flatpak/flatpak-builder-tools.git "$RUNNER_TEMP/tools"
          git -C "$RUNNER_TEMP/tools" checkout -q "$BUILDER_TOOLS"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "$RUNNER_TEMP/tools/node" aiohttp PyYAML tomlkit
          echo "FLATPAK_NODE_GENERATOR=$RUNNER_TEMP/venv/bin/flatpak-node-generator" >> "$GITHUB_ENV"
          echo "FLATPAK_CARGO_GENERATOR=$RUNNER_TEMP/venv/bin/python3 $RUNNER_TEMP/tools/cargo/flatpak-cargo-generator.py" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: steps.build.outputs.build == 'true'
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install JS dependencies
        if: steps.build.outputs.build == 'true'
        working-directory: app
        run: npm ci
      - name: Build, install and start the Flatpak
        if: steps.build.outputs.build == 'true'
        run: xvfb-run -a dbus-run-session -- scripts/package-flatpak.sh --smoke
      # Saved on main only (tags and pull requests restore from main),
      # without the build directories flatpak-builder keeps.
      - name: Trim flatpak-builder's state
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/.cache/react-native-gtk4/flatpak/state/build
          du -sh ~/.cache/react-native-gtk4/flatpak/state
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/react-native-gtk4/flatpak/state
          key: ${{ steps.rngtk.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.warm-up != 'true'
        with:
          name: linux-flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    needs: [version, macos, windows, linux, flatpak]
    # Not for dry runs or warm-ups.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      # Every skin in skins/ except the built-in Default, as a .sskin named
      # after the skin ("Hi-Fi '74" -> HiFi74.sskin).
      - name: Package the extra skins
        run: |
          for dir in skins/*/; do
            [ "$(basename "$dir")" = default ] && continue
            name=$(jq -r .name "$dir/skin.json" | tr -cd '[:alnum:]')
            cargo run -q --manifest-path core/Cargo.toml -p sound_scraper_skin \
              --example package_skin -- "$dir" "dist/$name.sskin"
          done
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Sound Scraper ${TAG#v}" --generate-notes "${flags[@]}"
