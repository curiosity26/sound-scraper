# Code-quality checks for every pull request and push to main: ESLint
# (React Native config + Prettier), TypeScript, Vitest, cargo fmt, clippy with
# warnings denied, the Rust tests, that the generated bridge types
# (app/src/bridge/generated) match the Rust definitions, and that the Linux app
# (app/linux, GTK4) builds. Clippy runs on each OS because the capture
# backends are platform-specific code.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --manifest-path core/Cargo.toml --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: lint-${{ matrix.os }}
      - run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml --workspace

  # The JS bridge types are generated from the Rust types (ts-rs, the `ts`
  # features); fail when the committed ones are stale.
  bridge-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: bridge-types
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run bridge:types
        working-directory: app
      - name: Check the generated types are up to date
        run: |
          # Count new files too.
          git add --intent-to-add app/src/bridge/generated
          if ! git diff --exit-code -- app/src/bridge/generated; then
            echo "::error::app/src/bridge/generated doesn't match the Rust bridge types. Run \`npm run bridge:types\` in app/ and commit the result."
            exit 1
          fi

  # The Linux app: the GTK4 native modules (app/linux) against
  # @curiosity26/react-native-gtk4 (an optional dependency, from GitHub).
  linux-app:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: lint-linux
      - name: Build the app (Release) and check it starts without JS errors
        working-directory: app
        run: |
          npx react-native run-linux --release --build-only
          xvfb-run -a env GDK_BACKEND=x11 linux/build/Release/SoundScraper --smoke
