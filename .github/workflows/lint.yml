# Code-quality checks for pull requests that touch the app or the core (main takes changes only
# through pull requests, so pushes to it aren't checked again): ESLint
# (React Native config + Prettier), TypeScript, Vitest, cargo fmt, clippy with
# warnings denied, the Rust tests, that the generated bridge types
# (app/src/bridge/generated) match the Rust definitions, and that the Linux app
# (app/linux, GTK4) builds. Clippy runs on each OS because the capture
# backends are platform-specific code.
name: Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which checks a pull request needs: the JS ones when it changes app/, the
  # Rust ones when it changes core/, skins/ (the core's tests load them) or
  # the toolchain, the bridge types when it changes any of those. A
  # website-only pull request skips them all.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      js: ${{ steps.changes.outputs.js }}
      rust: ${{ steps.changes.outputs.rust }}
      bridge: ${{ steps.changes.outputs.bridge }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        run: >-
          scripts/ci-changes.sh
          'js=^(app/|scripts/ci-changes\.sh$|\.github/workflows/lint\.yml$)'
          'rust=^(core/|skins/|skin\.schema\.json$|rust-toolchain\.toml$|scripts/ci-changes\.sh$|\.github/workflows/lint\.yml$)'
          'bridge=^(app/|core/|skins/|skin\.schema\.json$|rust-toolchain\.toml$|scripts/ci-changes\.sh$|\.github/workflows/lint\.yml$)'

  js:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  rustfmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --manifest-path core/Cargo.toml --all --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: lint-${{ matrix.os }}
      - run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml --workspace

  # The JS bridge types are generated from the Rust types (ts-rs, the `ts`
  # features); fail when the committed ones are stale.
  bridge-types:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: bridge-types
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run bridge:types
        working-directory: app
      - name: Check the generated types are up to date
        run: |
          # Count new files too.
          git add --intent-to-add app/src/bridge/generated
          if ! git diff --exit-code -- app/src/bridge/generated; then
            echo "::error::app/src/bridge/generated doesn't match the Rust bridge types. Run \`npm run bridge:types\` in app/ and commit the result."
            exit 1
          fi
