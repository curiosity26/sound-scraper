# Weekly dependency update pull requests, one grouped PR per ecosystem so
# Lint and E2E run once per batch. React Native and its platform packages
# (macOS, Windows, GTK4) move together and a React Native minor is a
# breaking release, so Dependabot proposes only their patches; bump their
# minors and majors by hand, together.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-native:
        patterns:
          - react-native
          - react-native-*
          - "@react-native/*"
          - "@react-native-community/*"
          - "@react-native-windows/*"
          - "@curiosity26/react-native-gtk4"
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: react-native
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native-*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-windows/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@curiosity26/react-native-gtk4"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # React Native 0.83's Babel preset and Metro are Babel 7; move to
      # Babel 8 together with a React Native release that supports it.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # astro check (@astrojs/check) supports TypeScript 5 and 6 only; move
      # to 7 when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Matches the Node version in site/.nvmrc; bump it with that.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # disc's #[implement] needs the windows-core that its windows uses,
      # and windows-core 0.100 came out before windows 0.100, so windows-core
      # alone can't move: bump it by hand in the same PR as windows.
      - dependency-name: windows-core
