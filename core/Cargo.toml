[workspace]
resolver = "3"
members = ["crates/core", "crates/capture", "crates/skin", "crates/vis"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# LAME built as a shared library (LGPL), see vendor/mp3lame-sys/Cargo.toml.
[patch.crates-io]
mp3lame-sys = { path = "vendor/mp3lame-sys" }
