# Local fork of mp3lame-sys 0.2.0 (LGPL-3.0, https://github.com/DoumanAsh/mp3lame-sys)
# that builds LAME 4.0 as a *shared* library instead of a static one, so the
# app links LAME dynamically as the LGPL requires. Bindings (src/) are unchanged.
[package]
name = "mp3lame-sys"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0"
description = "Bindings to mp3lame library (Sound Scraper fork: shared library build)"
links = "mp3lame"
publish = false
build = "build.rs"

[lib]
name = "mp3lame_sys"
path = "src/lib.rs"

[build-dependencies]
cc = "1"
