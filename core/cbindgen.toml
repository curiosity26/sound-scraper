# Generates core/include/sound_scraper.h (run by crates/core/build.rs).
language = "C"
include_guard = "SOUND_SCRAPER_H"
# Wraps declarations in extern "C" so Objective-C++ and C++/WinRT can include it.
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from core/crates/core/src/ffi.rs. Do not edit. */"
documentation = true
documentation_style = "c"
style = "both"
sys_includes = ["stdint.h", "stdbool.h"]
no_includes = true
usize_is_size_t = true

[parse]
parse_deps = false

[export]
prefix = ""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
