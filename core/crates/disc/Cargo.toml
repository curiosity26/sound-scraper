[package]
name = "sound_scraper_disc"
description = "Sound Scraper audio CDs: Red Book layout, cue/bin images and disc burners"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The simulated CD recorder, for test builds; never in releases.
simulator = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Imapi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
windows-core = "0.62"
