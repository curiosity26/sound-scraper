[package]
name = "sound_scraper_capture"
description = "Sound Scraper system/app audio capture backends"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
block2 = "0.6"
libc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
