[package]
name = "sound_scraper_skin"
description = "Sound Scraper skins: load, validate, install and resolve .sskin skins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# TypeScript bindings for the JS bridge (app/scripts/gen-bridge-types.js).
ts = ["dep:ts-rs"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sound_scraper_vis = { path = "../vis" }
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
