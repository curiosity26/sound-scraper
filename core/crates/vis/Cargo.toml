[package]
name = "sound_scraper_vis"
description = "Sound Scraper visualizer: audio analyzer and tiny-skia renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# TypeScript bindings for the JS bridge (app/scripts/gen-bridge-types.js).
ts = ["dep:ts-rs"]

[dependencies]
realfft = "3.5"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
triple_buffer = "9"
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl"] }
