[package]
name = "sound_scraper_nowplaying"
description = "Sound Scraper: what the OS says is playing (SMTC, MPRIS, MediaRemote)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Read by the macOS backend's logic, which is tested on every OS.
base64 = "0.23"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Async only since 6; driven from our threads with zbus::block_on (the
# default runtime is zbus's own, no tokio).
zbus = "6.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# Which apps are making sound (CoreAudio), to know when to ask them over
# AppleScript.
sound_scraper_capture = { path = "../capture" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
