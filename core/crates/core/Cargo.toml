[package]
name = "sound_scraper_core"
description = "Sound Scraper core: recorder, encoder, library, tags and the C ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
# staticlib is linked by the macOS (libsound_scraper_core.a) and Windows
# (sound_scraper_core.lib) apps; rlib is for Rust tests and tools.
crate-type = ["staticlib", "rlib"]

[features]
# The simulated CD recorder (test builds: Debug, or SS_SIMULATOR=1 when
# building); never in releases.
simulator = ["sound_scraper_disc/simulator"]

[dependencies]
sound_scraper_capture = { path = "../capture" }
sound_scraper_skin = { path = "../skin" }
sound_scraper_vis = { path = "../vis" }
sound_scraper_layout = { path = "../layout" }
sound_scraper_disc = { path = "../disc" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hound = "3.5"
id3 = "1.17"
mp3lame-encoder = "0.2"
# kqueue instead of FSEvents on macOS: FSEvents batched changes for seconds,
# and we only watch one flat folder.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
trash = "5"
rubato = "0.16"
rtrb = "0.4"
cpal = "0.18.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac"] }
# Lossless masters while recording (docs/track-editor-design.md §6.1).
flacenc = { version = "0.5", default-features = false }

[build-dependencies]
cbindgen = "0.29"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
